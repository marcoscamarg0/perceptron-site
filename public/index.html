<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perceptron Consultoria</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="admin-floating" id="adminFloating"></div>
    <div class="modal-overlay" id="loginModal"></div>
    <nav class="header" id="header"></nav>

    <div id="homePage">
        <section id="heroSection"></section>
        <section id="areasSection"></section>
    </div>
    <div id="sobrePage" class="page hidden"></div>
    <div id="noticiasPage" class="page hidden"></div>
    <div id="contatoPage" class="page hidden"></div>
    <footer class="footer" id="footer"></footer>

    <!-- Scripts normais (não-module) -->
    <script src="js/equipeImages.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- Firebase (module) -->
    <script type="module" src="js/firebase.js"></script>

    <!-- App scripts — carregam após Firebase estar pronto -->
    <script type="module">
        // Aguarda Firebase inicializar e seed
        async function init() {
            // Espera window.FirebaseDB ficar disponível
            while (!window.FirebaseDB) await new Promise(r => setTimeout(r, 50));
            await window.FirebaseDB.seedIfEmpty();

            // Carrega scripts do app em ordem
            const scripts = [
                'js/api.js',
                'js/components/adminButton.js',
                'js/components/loginModal.js',
                'js/components/header.js',
                'js/components/heroSection.js',
                'js/components/areasSection.js',
                'js/components/sobrePage.js',
                'js/components/noticiasPage.js',
                'js/components/contatoPage.js',
                'js/components/footer.js',
                'js/main.js'
            ];
            for (const src of scripts) {
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.body.appendChild(s);
                });
            }
        }
        init();
    </script>
</body>
</html>
