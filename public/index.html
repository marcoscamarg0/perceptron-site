<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perceptron Consultoria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Admin Floating Button -->
    <div class="admin-floating" id="adminFloating"></div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal"></div>

    <!-- Header -->
    <nav class="header" id="header"></nav>

    <!-- PÁGINA: HOME (scroll único) -->
    <div id="homePage">
        <!-- Hero Section -->
        <section id="heroSection"></section>
        <!-- Áreas de Atuação -->
        <section id="areasSection"></section>
    </div>

    <!-- PÁGINA: QUEM SOMOS -->
    <div id="sobrePage" class="page hidden"></div>

    <!-- PÁGINA: NOTÍCIAS/ARTIGOS -->
    <div id="noticiasPage" class="page hidden"></div>

    <!-- PÁGINA: CONTATO -->
    <div id="contatoPage" class="page hidden"></div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components/adminButton.js"></script>
    <script src="js/components/loginModal.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/heroSection.js"></script>
    <script src="js/components/areasSection.js"></script>
    <script src="js/components/sobrePage.js"></script>
    <script src="js/components/noticiasPage.js"></script>
    <script src="js/components/contatoPage.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
